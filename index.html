<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note by Note</title>
<meta name="description" content="Singing lessons with live pitch feedback, in your own key.">
<meta name="theme-color" content="#FBF3E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note by Note">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-soft.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Note by Note needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
<script>
  // If the app hasn't drawn anything after a few seconds (for example an older iPad that
  // can't run part of it), say so instead of leaving a blank screen.
  (function () {
    var shown = false;
    function help(detail) {
      var app = document.getElementById('app');
      if (shown || !app || app.children.length) return;
      shown = true;
      app.innerHTML = '<div style="padding:32px 24px;max-width:30em;margin:0 auto;font:17px/1.5 -apple-system,system-ui,sans-serif;color:#3a2a20">' +
        '<h1 style="font-size:24px;margin:0 0 12px">Note by Note couldn\u2019t start</h1>' +
        '<p>This device\u2019s browser may be too old for this version. Updating it usually fixes this: Settings \u203a General \u203a Software Update.</p>' +
        '<p>Then close the app fully and open it again.</p>' +
        '<p style="color:#7a6656;font-size:14px">' + String(detail || 'No details').replace(/[<>&]/g, '') + '</p></div>';
    }
    var last = '';
    window.addEventListener('error', function (e) { last = (e.message || '') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''); }, true);
    setTimeout(function () { help(last); }, 6000);
  })();
</script>
</body>
</html>
